<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SQUAD BASE OVERLAY</title><link rel="stylesheet" href="overlay.css"></head><body>
<div class="glass">
<header><span class="mark">✦</span><b>SQUAD BASE <span class="sub">OVERLAY</span></b><span id="clock" class="clock">--:--</span></header>
<div class="metrics" id="metrics">
 <div id="metric-cpu"><small>CPU</small><strong id="o-cpu">--%</strong></div>
 <div id="metric-gpu"><small>GPU</small><strong id="o-gpu">--%</strong></div>
 <div id="metric-ram"><small>RAM</small><strong id="o-ram">--%</strong></div>
 <div id="metric-gpuTemp"><small>GPU °C</small><strong id="o-temp">--</strong></div>
 <div id="metric-fps"><small>FPS</small><strong id="o-fps">–</strong></div>
 <div id="metric-ping"><small>TCP ms</small><strong id="o-ping">--</strong></div>
</div>
<div id="music" class="music" hidden><span>♫</span><div class="song"><b id="song-title">Spotify nicht verbunden</b><small id="song-sub">Spotify öffnen und anmelden</small></div><button id="song-back" title="Zurück">⏮</button><button id="song-play" title="Play/Pause">▶</button><button id="song-next" title="Weiter">⏭</button></div>
<div class="friends" id="friends" hidden>☻ <span>Freunde & Calls in SQUAD BASE</span> <button id="friends-open">↗</button></div>
<footer><span>Strg + Umschalt + O · Anzeigen/Ausblenden</span><span class="online">● LOKAL</span></footer>
</div>
<script src="overlay.js"></script><script src="overlay-drag.js"></script></body></html>
