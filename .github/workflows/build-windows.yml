name: SQUAD BASE für Windows bauen
on:
  workflow_dispatch:      # Knopf "Run workflow" im Reiter Actions
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Go-Tests
        id: tests
        continue-on-error: true   # ein umgebungsbedingt fehlschlagender Test soll die EXE nicht verhindern
        shell: pwsh
        working-directory: Quellcode/windows-app
        run: go test ./...
      - name: Programm, Uninstaller und Installer bauen
        shell: pwsh
        run: ./Quellcode/BUILD_ALL_WINDOWS.ps1 -Version 4.7.0 -SkipTests
      - name: Zusammenfassung
        if: always()
        shell: pwsh
        run: |
          "Go-Tests: ${{ steps.tests.outcome }}" | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: SquadBase-4.7.0-Windows
          path: Quellcode/dist/*
          if-no-files-found: error
