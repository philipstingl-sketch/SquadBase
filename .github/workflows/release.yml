name: Build and publish SquadBase release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: Quellcode/windows-app/go.mod
      - name: Validate release tag and source version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v4\.7\.\d+$') { throw "Release-Tag muss eine neue v4.7-Patchversion wie v4.7.1 sein; erhalten: $tag" }
          $target = $tag.Substring(1)
          $manifest = (Get-Content -Raw 'SquadBase_source_version.txt').Trim()
          $source = Get-Content -Raw 'Quellcode/windows-app/maintenance.go'
          $match = [regex]::Match($source, 'const squadVersion = "([^"]+)"')
          if (-not $match.Success) { throw 'squadVersion in maintenance.go nicht gefunden.' }
          if ($manifest -ne $match.Groups[1].Value) { throw 'SquadBase_source_version.txt passt nicht zur Quellversion.' }
          if ([version]$target -le [version]$manifest) { throw "Release $target ist nicht neuer als $manifest." }
          $source = [regex]::Replace($source, 'const squadVersion = "[^"]+"', ('const squadVersion = "' + $target + '"'), 1)
          Set-Content -Path 'Quellcode/windows-app/maintenance.go' -Value $source -NoNewline -Encoding utf8
          $html = Get-Content -Raw 'Quellcode/windows-app/web/index.html'
          $footerVersion = [regex]::Match($html, '<span class="version">v4\.7\.\d+</span>')
          if (-not $footerVersion.Success) { throw 'Versionsanzeige im App-Footer nicht gefunden.' }
          $html = [regex]::Replace($html, '<span class="version">v4\.7\.\d+</span>', ('<span class="version">v' + $target + '</span>'), 1)
          Set-Content -Path 'Quellcode/windows-app/web/index.html' -Value $html -NoNewline -Encoding utf8
          $installer = Get-Content -Raw 'Quellcode/installer/main.go'
          $installerMatch = [regex]::Match($installer, 'const installerVersion = "([^"]+)"')
          if (-not $installerMatch.Success) { throw 'installerVersion in installer/main.go nicht gefunden.' }
          $installer = [regex]::Replace($installer, 'const installerVersion = "[^"]+"', ('const installerVersion = "' + $target + '"'), 1)
          Set-Content -Path 'Quellcode/installer/main.go' -Value $installer -NoNewline -Encoding utf8
      - name: Build Windows x64 app, installer and checksums
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $dist = 'Quellcode/dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          ./Quellcode/BUILD_ALL_WINDOWS.ps1 -Version $version -SkipTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SquadBase ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            Quellcode/dist/SquadBase_v*_Friends_Tools.exe
            Quellcode/dist/SquadBase_v*_Installer.exe
            Quellcode/dist/SHA256SUMS.txt
