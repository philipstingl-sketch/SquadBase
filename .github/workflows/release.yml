name: Build and publish SquadBase release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: Quellcode/windows-app/go.mod
      - name: Validate release tag and source version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v4\.7\.\d+$') { throw "Release-Tag muss eine neue v4.7-Patchversion wie v4.7.1 sein; erhalten: $tag" }
          $target = $tag.Substring(1)
          $manifest = (Get-Content -Raw 'SquadBase_source_version.txt').Trim()
          $source = Get-Content -Raw 'Quellcode/windows-app/maintenance.go'
          $match = [regex]::Match($source, 'const squadVersion = "([^"]+)"')
          if (-not $match.Success) { throw 'squadVersion in maintenance.go nicht gefunden.' }
          if ($manifest -ne $match.Groups[1].Value) { throw 'SquadBase_source_version.txt passt nicht zur Quellversion.' }
          if ([version]$target -le [version]$manifest) { throw "Release $target ist nicht neuer als $manifest." }
          $source = [regex]::Replace($source, 'const squadVersion = "[^"]+"', ('const squadVersion = "' + $target + '"'), 1)
          Set-Content -Path 'Quellcode/windows-app/maintenance.go' -Value $source -NoNewline -Encoding utf8
      - name: Build Windows x64 EXE and checksum
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $dist = 'Quellcode/windows-app/dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $name = "SquadBase_v${version}_Friends_Tools.exe"
          Push-Location Quellcode/windows-app
          try {
            $env:GOOS = 'windows'; $env:GOARCH = 'amd64'; $env:CGO_ENABLED = '0'
            go build -trimpath -ldflags='-s -w -H=windowsgui' -o "dist/$name" .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          $file = Join-Path $dist $name
          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
          "$hash *$name" | Set-Content -Path (Join-Path $dist 'SHA256SUMS.txt') -Encoding ascii
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SquadBase ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            Quellcode/windows-app/dist/SquadBase_v*_*_Tools.exe
            Quellcode/windows-app/dist/SHA256SUMS.txt
